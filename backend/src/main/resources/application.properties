
# ==========================================
# QueueLess - Application Configuration
# ==========================================

# Application
spring.application.name=queueless
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3307/queueless_db
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Authentication
# ==========================================

# Local-development fallback only.
# Set JWT_SECRET to a private, strong secret before deployment.
jwt.secret=change-this-secret-it-must-be-at-least-32-chars

# Token expiration: 24 hours (milliseconds)
jwt.expiration-ms=86400000

# ==========================================
# Email Notifications (Spring Mail)
# ==========================================

# Configure these environment variables if email notifications
# are enabled. Do not put real email passwords in source control.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Error Handling
# ==========================================


server.error.include-binding-errors=always
server.error.include-message=always

spring.config.import=optional:classpath:local.properties